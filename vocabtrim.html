        }

        function handleAction(action, element) {
          const row = element.closest("[data-list-id]");
          const id = row ? row.getAttribute("data-list-id") : state.listId;
          if (action === "import") {
            fileInput.value = "";
            fileInput.click();
          } else if (action === "home") {
            state.screen = "list";
            state.listId = "";
            state.marking = "";
            closeMore(false);
            state.moreHoverSuppressed = false;
            state.openingId = "";
            state.renamingId = "";
            state.renameDraft = null;
            state.markToken += 1;
            render();
          } else if (action === "back") {
            leaveOpen();
          } else if (action === "copy") {
            state.listId = id;
            createCopy();
          } else if (action === "rename") {
            beginRename(id);
          } else if (action === "confirm-rename") {
            confirmRename();
          } else if (action === "cancel-rename") {
            cancelRename();
          } else if (action === "delete") {
            deleteList(id);
          } else if (action === "export") {
            const list = state.lists.find((item) => item.id === id);
            if (list) {
              downloadList(list, list.name);
              showNotice("已导出：" + displayName(list.name));
            }
          } else if (action === "produce") {
            produceList();
          } else if (action === "toggle-more") {
            toggleMore();
          } else if (action === "toggle-default-details") {
            toggleDefaultDetails();
          } else if (action === "sort-alpha") {
            reorderCurrentList("alpha");
          } else if (action === "shuffle-order") {
            reorderCurrentList("shuffle");
          } else if (action === "clear-all") {
            markAll("", false);
          } else if (action === "mark-unmarked-keep") {
            markAll("keep", true);
          } else if (action === "mark-unmarked-cross") {
            markAll("crossed", true);
          } else if (action === "mark-all-keep") {
            markAll("keep", false);
          } else if (action === "mark-all-cross") {
            markAll("crossed", false);
          } else if (action === "details") {
            toggleDetails();
          } else if (action === "keep") {
            markCurrent("keep");
          } else if (action === "cross") {
            markCurrent("crossed");
          } else if (action === "next") {
            nextWord();
          } else if (action === "previous") {
            previousWord();
          } else if (action === "dismiss") {
            dismissNotice();
          }
        }

        function wire() {
          app.querySelectorAll("[data-action]").forEach((element) => {
            element.addEventListener("click", (event) => {
              event.stopPropagation();
              handleAction(element.getAttribute("data-action"), element);
            });
          });
          app.querySelectorAll(".list-row").forEach((row) => {
            const id = row.getAttribute("data-list-id");
            const openFromRow = (event) => {
              if (event.target.closest("button, input, textarea, select, [data-action]")) return;
              openList(id, row);
            };
            row.addEventListener("click", openFromRow);
            row.addEventListener("keydown", (event) => {
              if ((event.key === "Enter" || event.key === " ") && event.target === row) {
                event.preventDefault();
                openList(id, row);
              }
            });
          });
          const moreMenu = app.querySelector(".more-menu");
          if (moreMenu && CAN_HOVER) {
            moreMenu.addEventListener("mouseenter", () => {
              if (state.moreHoverSuppressed || state.moreOpen) return;
              state.moreOpen = true;
              state.moreOpenByClick = false;
              render();
            });
            moreMenu.addEventListener("mouseleave", () => {
              window.clearTimeout(state.moreSuppressTimer);
              state.moreSuppressTimer = 0;
              state.moreHoverSuppressed = false;
              if (!state.moreOpen) return;
              closeMore(false);
              render();
            });
          }
          const word = document.getElementById("current-word");
          if (word && state.screen === "workspace") {
            word.addEventListener("click", copyCurrentWord);
            word.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                copyCurrentWord();
              }
            });
          }
          const renameDialogInput = document.getElementById("rename-dialog-input");
          if (renameDialogInput) {
            renameDialogInput.focus();
            renameDialogInput.select();
            renameDialogInput.addEventListener("keydown", (event) => {
              if (event.key === "Enter") {
                event.preventDefault();
                confirmRename();
              } else if (event.key === "Escape") {
                event.preventDefault();
                cancelRename();
              }
            });
            renameDialogInput.addEventListener("input", () => {
              if (state.renamingId) state.renameDraft = renameDialogInput.value;
            });
          }
          const renameBackdrop = app.querySelector(".rename-backdrop");
          if (renameBackdrop) {
            renameBackdrop.addEventListener("click", (event) => {
              if (event.target === renameBackdrop) cancelRename();
            });
          }
          const range = document.getElementById("open-range");
          if (range) {
            range.addEventListener("input", updateOpenPreview);
            range.addEventListener("change", () => {
              const list = getList();
              if (list) rememberPosition(list, state.index, true);
            });
          }
          app.querySelectorAll("[data-motion]").forEach((input) => {
            const kind = input.getAttribute("data-motion");
            input.addEventListener("input", () => {
              setMotionDuration(kind, input.value, false);
            });
            input.addEventListener("change", () => {
              setMotionDuration(kind, input.value, true);
            });
          });
        }

        fileInput.addEventListener("change", () => {
          const file = fileInput.files && fileInput.files[0];
          if (file) importFile(file);
        });

        document.addEventListener("click", handleDocumentClick);
        render();
        hydrateFromDatabase();
      })();
    </script>
  </body>
</html>
