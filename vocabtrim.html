<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>词表速筛</title>
    <style>
      :root {
        --black: #000;
        --white: #fff;
        --muted: #666;
        --line: #000;
        --soft-line: #cfcfcf;
        --cross-motion-duration: 205ms;
        --strike-motion-duration: 90ms;
        --details-motion-duration: 220ms;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      html { background: var(--white); }
      body {
        margin: 0;
        background: var(--white);
        color: var(--black);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        text-rendering: optimizeLegibility;
      }
      button, input { color: inherit; font: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      button:focus-visible, input:focus-visible {
        outline: 3px solid var(--black);
        outline-offset: 4px;
      }
      .hidden-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .shell { min-height: 100svh; }
      .topbar {
        width: min(1440px, calc(100% - 48px));
        min-height: 82px;
        margin: 0 auto;
        border-bottom: 2px solid var(--black);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .brand {
        border: 0;
        background: transparent;
        padding: 0;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -.07em;
        cursor: pointer;
      }
      .topbar-action {
        border: 2px solid var(--black);
        border-radius: 999px;
        background: var(--white);
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: background 160ms ease, color 160ms ease, transform 160ms ease;
      }
      .topbar-action:hover {
        background: var(--black);
        color: var(--white);
        transform: translateY(-2px);
      }
      .page {
        width: min(1440px, calc(100% - 48px));
        margin: 0 auto;
      }
      .list {
        border-bottom: 2px solid var(--black);
      }
      .list-row {
        position: relative;
        isolation: isolate;
        min-height: 116px;
        padding: 22px 0;
        border-bottom: 1px solid var(--soft-line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        cursor: pointer;
        transform-origin: center;
      }
      .list-row::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 8px -16px;
        border-radius: 22px;
        background: #f2f2f2;
        opacity: 0;
        transform: scale(.985);
        transition: opacity 170ms ease, transform 220ms cubic-bezier(.22, 1, .36, 1);
      }
      .list-row:hover::before,
      .list-row:focus-visible::before {
        opacity: 1;
        transform: scale(1);
      }
      .list-row:last-child { border-bottom: 0; }
      .list-row.is-opening {
        animation: row-open 260ms cubic-bezier(.22, 1, .36, 1) both;
        pointer-events: none;
      }
      .list-row.is-opening::before {
        animation: row-open-surface 260ms cubic-bezier(.22, 1, .36, 1) both;
      }
      .list-title {
        min-width: 0;
      }
      .list-title h2 {
        max-width: 700px;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: clamp(21px, 2.2vw, 32px);
        font-weight: 850;
        letter-spacing: -.055em;
      }
      .list-meta {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }
      .list-actions {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }
      .list-actions button {
        min-height: 42px;
        border: 1.5px solid var(--black);
        border-radius: 999px;
        background: var(--white);
        padding: 8px 15px;
        font-size: 13px;
        font-weight: 750;
        cursor: pointer;
        transition: background 160ms ease, color 160ms ease;
      }
      .list-actions button:hover {
        background: var(--black);
        color: var(--white);
      }
      .list-actions .delete-action:hover {
        border-color: #c00000;
        background: #c00000;
        color: var(--white);
      }
      .rename-backdrop {
        position: fixed;
        z-index: 40;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgb(0 0 0 / 30%);
        backdrop-filter: blur(12px);
        animation: dialog-backdrop-in 180ms ease both;
      }
      .rename-dialog {
        width: min(520px, 100%);
        border: 0;
        border-radius: 28px;
        background: var(--white);
        padding: 30px;
        box-shadow: 0 30px 90px rgb(0 0 0 / 28%);
        animation: dialog-in 240ms cubic-bezier(.22, 1, .36, 1) both;
      }
      .rename-dialog h2 {
        margin: 0;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -.06em;
        text-align: center;
      }
      .rename-dialog input {
        width: 100%;
        margin-top: 28px;
        border: 0;
        border-bottom: 1.5px solid var(--black);
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        padding: 4px 0 10px;
        color: inherit;
        font-size: 24px;
        font-weight: 780;
        letter-spacing: -.04em;
        text-align: center;
        -webkit-appearance: none;
        appearance: none;
      }
      .rename-dialog input:focus,
      .rename-dialog input:focus-visible {
        outline: 0;
      }
      .rename-dialog-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 28px;
      }
      .rename-dialog-actions button {
        min-height: 54px;
        border: 0;
        border-radius: 999px;
        background: #ededed;
        padding: 10px 18px;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 100ms ease, background 150ms ease;
      }
      .rename-dialog-actions button:hover { background: #dedede; }
      .rename-dialog-actions button:active { transform: scale(.98); }
      .rename-dialog-actions .rename-confirm {
        background: var(--black);
        color: var(--white);
      }
      .rename-dialog-actions .rename-confirm:hover { background: #292929; }
      .empty {
        min-height: 60svh;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 24px;
      }
      .empty p {
        margin: 0;
        font-size: 30px;
        font-weight: 850;
        letter-spacing: -.06em;
      }
      .workspace-page {
        padding-bottom: 350px;
      }
      .workspace-top {
        min-height: 82px;
        border-bottom: 2px solid var(--black);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 24px;
      }
      .back-button, .produce-button, .more-button {
        border: 0;
        background: transparent;
        padding: 10px 0;
        font-size: clamp(16px, 1.35vw, 19px);
        font-weight: 800;
        cursor: pointer;
        white-space: nowrap;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 6px;
      }
      .back-button { justify-self: start; }
      .produce-button { justify-self: end; }
      .back-button:hover, .produce-button:hover, .more-button:hover {
        text-decoration-thickness: 3px;
      }
      .more-menu {
        position: relative;
        justify-self: center;
      }
      .more-menu::after {
        content: "";
        position: absolute;
        z-index: 24;
        top: 100%;
        left: 50%;
        width: min(360px, calc(100vw - 32px));
        height: 14px;
        transform: translateX(-50%);
      }
      .more-button {
        display: block;
        touch-action: manipulation;
      }
      .more-panel {
        position: absolute;
        z-index: 25;
        top: calc(100% + 12px);
        left: 50%;
        width: min(360px, calc(100vw - 32px));
        padding: 10px;
        border: 1.5px solid var(--black);
        border-radius: 18px;
        background: var(--white);
        box-shadow: 0 20px 52px rgb(0 0 0 / 16%);
        transform: translateX(-50%);
        max-height: calc(100svh - 112px);
        overflow-y: auto;
      }
      .more-actions {
        padding-bottom: 8px;
        border-bottom: 1px solid #dedede;
      }
      .more-panel button {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 9px;
        background: transparent;
        padding: 12px 14px;
        color: inherit;
        text-align: left;
        font-size: 14px;
        font-weight: 750;
        cursor: pointer;
        touch-action: manipulation;
      }
      .more-panel button:hover {
        background: var(--black);
        color: var(--white);
      }
      .motion-control {
        display: grid;
        gap: 10px;
        margin-top: 8px;
        border-radius: 12px;
        background: #f3f3f3;
        padding: 12px 14px 13px;
      }
      .motion-control-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        font-size: 13px;
        font-weight: 760;
      }
      .motion-value {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .motion-control input {
        width: 100%;
        height: 6px;
        margin: 0;
        accent-color: var(--black);
        cursor: ew-resize;
      }
      .progress-area {
        padding: 20px 0 0;
      }
      .progress-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .progress-line p { margin: 0; }
      .progress-name {
        min-width: 0;
        max-width: min(70vw, 720px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .range-wrap {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 16px;
      }
      .range-wrap input {
        width: 100%;
        min-width: 0;
        height: 8px;
        accent-color: var(--black);
        cursor: grab;
      }
      .range-wrap input:active { cursor: grabbing; }
      .word-area {
        min-height: clamp(340px, 52vh, 600px);
        padding: 64px 20px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .word-area.has-details:not(.is-marking):not(.is-hiding) .word-wrap {
        animation: word-lift 220ms ease both;
      }
      .word-area.has-details.is-marking .word-wrap {
        transform: translateY(-24px);
      }
      .word-area.has-details.is-hiding .word-wrap {
        animation: word-drop var(--details-motion-duration) cubic-bezier(.22, 1, .36, 1) both;
        will-change: transform;
      }
      .word-area.has-details.is-marking .details-panel {
        animation: none;
      }
      .word-area.has-details.is-marking.is-cross-marking .details-panel {
        animation: details-cross-exit var(--cross-motion-duration) cubic-bezier(.7, 0, .2, 1) both;
        will-change: transform, opacity;
      }
      .word-area.has-details.is-hiding .details-panel {
        animation: details-out var(--details-motion-duration) cubic-bezier(.22, 1, .36, 1) both;
        will-change: transform, opacity;
      }
      .word-wrap { position: relative; max-width: 100%; }
      .word {
        position: relative;
        margin: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
        font-size: clamp(68px, 12vw, 184px);
        font-weight: 680;
        line-height: .9;
        letter-spacing: -.085em;
        transition: color 95ms ease;
      }
      .word.is-clickable { cursor: pointer; }
      .word::before,
      .word::after {
        content: "";
        position: absolute;
        z-index: 1;
        left: -3%;
        width: 106%;
        height: clamp(5px, .55vw, 10px);
        border-radius: 999px;
        background: currentColor;
        transform: scaleX(0);
        transform-origin: left center;
      }
      .word::before {
        top: 47%;
      }
      .word::after {
        top: 58%;
      }
      .word.is-kept::before {
        top: calc(100% + .08em);
        height: clamp(4px, .42vw, 8px);
        transform: scaleX(1);
      }
      .word.is-kept::after {
        display: none;
      }
      .word.is-crossed {
        color: #777;
      }
      .word.is-crossed::before,
      .word.is-crossed::after {
        transform: scaleX(1);
      }
      .word.is-crossed.is-animating::before,
      .word.is-crossed.is-animating::after {
        animation: strike-draw var(--strike-motion-duration) cubic-bezier(.76, 0, .24, 1) both;
      }
      .word.is-crossed.is-animating {
        animation: cross-exit var(--cross-motion-duration) cubic-bezier(.7, 0, .2, 1) both;
        will-change: transform, opacity, color;
      }
      .details-panel {
        width: min(860px, 100%);
        margin-top: 42px;
        border-top: 2px solid var(--black);
        border-bottom: 2px solid var(--black);
        padding: 20px 0 16px;
        text-align: left;
        animation: details-in 220ms ease both;
      }
      .phonetics {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 30px;
        margin-bottom: 18px;
      }
      .phonetics p {
        margin: 0;
        font-size: 16px;
        font-weight: 750;
      }
      .phonetics span {
        margin-right: 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }
      .definitions { display: grid; gap: 10px; }
      .definition {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 8px;
      }
      .definition > span {
        padding-top: 3px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
        text-align: right;
      }
      .definition p {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .definition .english {
        margin-top: 2px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .fixed-actions {
        position: fixed;
        z-index: 20;
        right: 0;
        bottom: 0;
        left: 0;
        min-height: 322px;
        padding: 18px max(24px, calc((100vw - 1440px) / 2)) 22px;
        background: var(--white);
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(3, minmax(0, 1fr));
        grid-template-areas:
          "next next"
          "previous details"
          "cross keep";
        column-gap: 16px;
        row-gap: 18px;
      }
      .fixed-actions button {
        min-height: 88px;
        border: 2.5px solid var(--black);
        border-radius: 999px;
        background: var(--white);
        padding: 10px 24px;
        font-size: clamp(26px, 3.2vw, 46px);
        font-weight: 800;
        letter-spacing: -.06em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 90ms ease;
        touch-action: manipulation;
      }
      .fixed-actions button[data-action="next"] { grid-area: next; }
      .fixed-actions button[data-action="previous"] { grid-area: previous; }
      .fixed-actions button[data-action="details"] { grid-area: details; }
      .fixed-actions button[data-action="cross"] { grid-area: cross; }
      .fixed-actions button[data-action="keep"] { grid-area: keep; }
      .fixed-actions button:active:not(:disabled) { transform: scale(.985); }
      .fixed-actions button:disabled {
        color: #aaa;
        border-color: #aaa;
        cursor: default;
      }
      .notice {
        position: fixed;
        z-index: 50;
        top: 50%;
        left: 50%;
        width: max-content;
        max-width: min(560px, calc(100vw - 40px));
        border: 0;
        border-radius: 20px;
        background: rgb(235 235 235 / 97%);
        color: #111;
        padding: 18px 26px;
        font-size: 16px;
        font-weight: 800;
        line-height: 1.45;
        text-align: center;
        transform: translate(-50%, -50%);
        box-shadow: 0 24px 70px rgb(0 0 0 / 20%);
        animation: notice-in 260ms cubic-bezier(.22, 1, .36, 1) both;
        backdrop-filter: blur(16px);
      }
      .notice.is-leaving {
        animation: notice-out 220ms cubic-bezier(.7, 0, .2, 1) both;
        pointer-events: none;
      }
      .notice.error {
        background: #171717;
        color: var(--white);
        box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
      }
      @keyframes strike-draw {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @keyframes cross-exit {
        0% {
          color: var(--black);
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        42% {
          color: #777;
          opacity: 1;
          transform: translateY(4px) scale(1);
        }
        100% {
          color: #777;
          opacity: 0;
          transform: translateY(24px) scale(.985);
        }
      }
      @keyframes word-lift {
        from { transform: translateY(0); }
        to { transform: translateY(-24px); }
      }
      @keyframes row-open {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        38% {
          opacity: 1;
          transform: scale(.992);
        }
        100% {
          opacity: 0;
          transform: scale(1.012);
        }
      }
      @keyframes row-open-surface {
        0% {
          opacity: 0;
          transform: scale(.985);
        }
        36% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 1;
          transform: scale(1.018);
        }
      }
      @keyframes notice-in {
        from {
          opacity: 0;
          transform: translate(-50%, calc(-50% + 18px)) scale(.94);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      @keyframes notice-out {
        from {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        to {
          opacity: 0;
          transform: translate(-50%, calc(-50% - 14px)) scale(.96);
        }
      }
      @keyframes details-in {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes details-cross-exit {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(28px); }
      }
      @keyframes word-drop {
        from { transform: translateY(var(--word-return-start, -24px)); }
        to { transform: translateY(var(--word-return-end, 0px)); }
      }
      @keyframes details-out {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(28px); }
      }
      @keyframes dialog-backdrop-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes dialog-in {
        from {
          opacity: 0;
          transform: translateY(18px) scale(.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @media (max-width: 760px) {
        .topbar, .page { width: min(100% - 32px, 1440px); }
        .topbar { min-height: 72px; }
        .brand { font-size: 21px; }
        .topbar-action { padding: 10px 16px; font-size: 13px; }
        .list-row {
          align-items: flex-start;
          flex-direction: column;
          gap: 17px;
        }
        .list-title h2 { max-width: calc(100vw - 32px); }
        .list-actions { justify-content: flex-start; }
        .list-actions button { min-height: 38px; padding-inline: 12px; }
        .rename-dialog { padding: 24px; border-radius: 24px; }
        .rename-dialog h2 { font-size: 27px; }
        .rename-dialog input { font-size: 21px; }
        .workspace-top { gap: 10px; }
        .back-button, .produce-button, .more-button { font-size: 15px; }
        .word-area { min-height: 45svh; padding: 48px 4px 32px; }
        .word { font-size: clamp(58px, 18vw, 108px); }
        .details-panel { margin-top: 30px; }
        .fixed-actions {
          min-height: 292px;
          padding: 14px 12px 18px;
          column-gap: 8px;
          row-gap: 12px;
        }
        .fixed-actions button {
          min-height: 74px;
          font-size: 32px;
        }
        .more-panel { width: min(340px, calc(100vw - 24px)); }
        .workspace-page { padding-bottom: 320px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <input id="file-input" class="hidden-input" type="file" accept=".json,application/json">
    <noscript>请启用 JavaScript 后使用词表速筛</noscript>
    <script>
      (() => {
        "use strict";

        const STORAGE_KEY = "word-sieve.static.v2";
        const METADATA_KEY = STORAGE_KEY + ".metadata";
        const HISTORY_STATE_KEY = "vocabtrimSavedState";
        const HISTORY_METADATA_KEY = "vocabtrimSavedMetadata";
        const WINDOW_NAME_PREFIX = "__VOCABTRIM_STATE__:";
        const DATABASE_NAME = "vocabtrim-storage-v1";
        const DATABASE_STORE = "app-state";
        const DATABASE_RECORD_KEY = "current";
        const MAX_HISTORY_STATE_LENGTH = 1500000;
        const MAX_WINDOW_NAME_LENGTH = 64000000;
        const DEFAULT_KEEP_DURATION = 60;
        const DEFAULT_CROSS_DURATION = 205;
        const DETAILS_TOGGLE_DURATION = 220;
        const CAN_HOVER = typeof window.matchMedia === "function" &&
          window.matchMedia("(hover: hover) and (pointer: fine)").matches;
        let databasePromise = null;
        let databaseUnavailable = false;
        let pendingDatabaseRecord = null;
        let databaseWriteInFlight = false;
        const savedData = loadSavedData();
        const app = document.getElementById("app");
        const fileInput = document.getElementById("file-input");
        const state = {
          lists: savedData.lists,
          keepDuration: savedData.keepDuration,
          crossDuration: savedData.crossDuration,
          defaultDetails: savedData.defaultDetails,
          screen: "list",
          listId: "",
          index: 0,
          details: false,
          detailsHiding: false,
          detailsReturnStartY: -24,
          detailsReturnEndY: 0,
          detailsToken: 0,
          marking: "",
          markToken: 0,
          moreOpen: false,
          moreOpenByClick: false,
          moreHoverSuppressed: false,
          moreSuppressTimer: 0,
          openingId: "",
          renamingId: "",
          renameDraft: null,
          notice: "",
          error: "",
          noticeTimer: 0,
          noticeCloseTimer: 0,
          noticeClosing: false,
          savedAt: savedData.savedAt,
          dataRevision: 0
        };
        applyMotionSettings();

        function isObject(value) {
          return value !== null && typeof value === "object" && !Array.isArray(value);
        }

        function text(value) {
          return typeof value === "string" ? value.trim() : "";
        }

        function clone(value) {
          return JSON.parse(JSON.stringify(value));
        }

        function escapeHTML(value) {
          return String(value == null ? "" : value).replace(/[&<>"']/g, (character) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#39;"
          })[character]);
        }

        function uid() {
          if (window.crypto && typeof window.crypto.randomUUID === "function") {
            return window.crypto.randomUUID();
          }
          return "list-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
        }

        function normalizeList(list) {
          if (!isObject(list) || !Array.isArray(list.records)) return null;
          const records = list.records.filter((record) => isObject(record));
          const statuses = Array.isArray(list.statuses)
            ? records.map((_, index) => list.statuses[index] === "keep" || list.statuses[index] === "crossed" ? list.statuses[index] : "")
            : records.map(() => "");
          const cursor = Number.isInteger(list.cursor)
            ? Math.max(0, Math.min(list.cursor, Math.max(records.length - 1, 0)))
            : 0;
          return {
            id: text(list.id) || uid(),
            name: text(list.name) || "未命名词表.json",
            records,
            shape: isObject(list.shape) ? list.shape : { kind: "ndjson" },
            statuses,
            cursor,
            updatedAt: text(list.updatedAt) || new Date().toISOString()
          };
        }

        function normalizeDuration(value, fallback) {
          const duration = Number(value);
          if (!Number.isFinite(duration)) return fallback;
          return Math.max(0, Math.min(1000, Math.round(duration / 5) * 5));
        }

        function defaultSavedData() {
          return {
            lists: [],
            keepDuration: DEFAULT_KEEP_DURATION,
            crossDuration: DEFAULT_CROSS_DURATION,
            defaultDetails: false,
            savedAt: 0
          };
        }

        function parseSavedValue(value) {
          if (!value) return null;
          try {
            return typeof value === "string" ? JSON.parse(value) : value;
          } catch (error) {
            return null;
          }
        }

        function normalizeSavedPayload(value) {
          const saved = parseSavedValue(value);
          if (!isObject(saved)) return null;
          const settings = isObject(saved.settings) ? saved.settings : {};
          return {
            lists: Array.isArray(saved.lists)
              ? saved.lists.map(normalizeList).filter(Boolean)
              : [],
            keepDuration: normalizeDuration(settings.keepDuration, DEFAULT_KEEP_DURATION),
            crossDuration: normalizeDuration(settings.crossDuration, DEFAULT_CROSS_DURATION),
            defaultDetails: settings.defaultDetails === true,
            savedAt: Number.isFinite(Number(saved.savedAt)) ? Number(saved.savedAt) : 0
          };
        }

        function normalizeSavedMetadata(value) {
          const saved = parseSavedValue(value);
          if (!isObject(saved)) return null;
          const settings = isObject(saved.settings) ? saved.settings : {};
          const lists = Array.isArray(saved.lists)
            ? saved.lists.map((list) => {
                if (!isObject(list) || !text(list.id)) return null;
                return {
                  id: text(list.id),
                  name: text(list.name),
                  statuses: Array.isArray(list.statuses) ? list.statuses : [],
                  cursor: Number.isInteger(list.cursor) ? list.cursor : 0,
                  updatedAt: text(list.updatedAt)
                };
              }).filter(Boolean)
            : [];
          return {
            lists,
            keepDuration: normalizeDuration(settings.keepDuration, DEFAULT_KEEP_DURATION),
            crossDuration: normalizeDuration(settings.crossDuration, DEFAULT_CROSS_DURATION),
            defaultDetails: settings.defaultDetails === true,
            savedAt: Number.isFinite(Number(saved.savedAt)) ? Number(saved.savedAt) : 0
          };
        }

        function loadSavedMetadata() {
          const candidates = [];
          const collect = (value) => {
            const candidate = normalizeSavedMetadata(value);
            if (candidate) candidates.push(candidate);
          };
          try {
            collect(window.localStorage.getItem(METADATA_KEY));
          } catch (error) {
            // 继续尝试其他轻量容错层。
          }
          try {
            collect(window.sessionStorage.getItem(METADATA_KEY));
          } catch (error) {
            // 继续尝试历史记录。
          }
          try {
            const historyState = window.history && window.history.state;
            collect(isObject(historyState) ? historyState[HISTORY_METADATA_KEY] : null);
          } catch (error) {
            // 忽略不可用的历史记录状态。
          }
          if (!candidates.length) return null;
          return candidates.reduce((newest, candidate) => (
            candidate.savedAt > newest.savedAt ? candidate : newest
          ));
        }

        function applySavedMetadata(saved, metadata) {
          if (!metadata || metadata.savedAt < saved.savedAt) return saved;
          if (!saved.lists.length && metadata.lists.length) {
            return {
              lists: [],
              keepDuration: metadata.keepDuration,
              crossDuration: metadata.crossDuration,
              defaultDetails: metadata.defaultDetails,
              savedAt: saved.savedAt
            };
          }
          const byId = new Map(saved.lists.map((list) => [list.id, list]));
          const lists = metadata.lists.map((item) => {
            const list = byId.get(item.id);
            if (!list) return null;
            list.name = item.name || list.name;
            list.statuses = list.records.map((_, index) => (
              item.statuses[index] === "keep" || item.statuses[index] === "crossed"
                ? item.statuses[index]
                : ""
            ));
            list.cursor = Math.max(
              0,
              Math.min(item.cursor, Math.max(list.records.length - 1, 0)),
            );
            list.updatedAt = item.updatedAt || list.updatedAt;
            return list;
          }).filter(Boolean);
          return {
            lists,
            keepDuration: metadata.keepDuration,
            crossDuration: metadata.crossDuration,
            defaultDetails: metadata.defaultDetails,
            savedAt: metadata.savedAt
          };
        }

        function shouldApplyRestoredData(restored) {
          if (restored.savedAt > state.savedAt) return true;
          if (restored.savedAt < state.savedAt) return false;
          if (restored.lists.length > state.lists.length) return true;
          const currentIds = new Set(state.lists.map((list) => list.id));
          if (restored.lists.some((list) => !currentIds.has(list.id))) return true;
          const restoredRecords = restored.lists.reduce((total, list) => total + list.records.length, 0);
          const currentRecords = state.lists.reduce((total, list) => total + list.records.length, 0);
          return restoredRecords > currentRecords;
        }

        function loadSavedData() {
          const candidates = [];
          const collect = (value) => {
            const candidate = normalizeSavedPayload(value);
            if (candidate) candidates.push(candidate);
          };
          try {
            collect(window.localStorage.getItem(STORAGE_KEY));
          } catch (error) {
            // file:// 页面可能拒绝 localStorage，继续尝试其他容错层。
          }
          try {
            collect(window.sessionStorage.getItem(STORAGE_KEY));
          } catch (error) {
            // 某些移动浏览器也会限制 sessionStorage。
          }
          try {
            const historyState = window.history && window.history.state;
            collect(isObject(historyState) ? historyState[HISTORY_STATE_KEY] : null);
          } catch (error) {
            // 忽略不可用的历史记录状态。
          }
          try {
            if (typeof window.name === "string" && window.name.indexOf(WINDOW_NAME_PREFIX) === 0) {
              collect(window.name.slice(WINDOW_NAME_PREFIX.length));
            }
          } catch (error) {
            // 忽略不可用的窗口状态。
          }
          const saved = !candidates.length ? defaultSavedData() : candidates.reduce((newest, candidate) => (
            candidate.savedAt > newest.savedAt ? candidate : newest
          ));
          return applySavedMetadata(saved, loadSavedMetadata());
        }

        function createSavedPayload(savedAt) {
          return {
            lists: state.lists,
            settings: {
              keepDuration: state.keepDuration,
              crossDuration: state.crossDuration,
              defaultDetails: state.defaultDetails
            },
            savedAt
          };
        }

        function createSavedMetadata(savedAt) {
          return {
            lists: state.lists.map((list) => ({
              id: list.id,
              name: list.name,
              statuses: list.statuses,
              cursor: list.cursor,
              updatedAt: list.updatedAt
            })),
            settings: {
              keepDuration: state.keepDuration,
              crossDuration: state.crossDuration,
              defaultDetails: state.defaultDetails
            },
            savedAt
          };
        }

        function openDatabase() {
          return new Promise((resolve, reject) => {
            let indexedDB;
            try {
              indexedDB = window.indexedDB;
            } catch (error) {
              reject(error);
              return;
            }
            if (!indexedDB || typeof indexedDB.open !== "function") {
              reject(new Error("IndexedDB unavailable"));
              return;
            }
            let request;
            try {
              request = indexedDB.open(DATABASE_NAME, 1);
            } catch (error) {
              reject(error);
              return;
            }
            request.onupgradeneeded = () => {
              const database = request.result;
              if (!database.objectStoreNames.contains(DATABASE_STORE)) {
                database.createObjectStore(DATABASE_STORE);
              }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error || new Error("IndexedDB open failed"));
            request.onblocked = () => reject(new Error("IndexedDB blocked"));
          });
        }

        function getDatabase() {
          if (databaseUnavailable) return Promise.reject(new Error("IndexedDB unavailable"));
          if (!databasePromise) {
            databasePromise = openDatabase().catch((error) => {
              databaseUnavailable = true;
              databasePromise = null;
              throw error;
            });
          }
          return databasePromise;
        }

        function writeDatabaseRecord(record) {
          return getDatabase().then((database) => new Promise((resolve, reject) => {
            let transaction;
            try {
              transaction = database.transaction(DATABASE_STORE, "readwrite");
              transaction.objectStore(DATABASE_STORE).put(record, DATABASE_RECORD_KEY);
            } catch (error) {
              reject(error);
              return;
            }
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error || new Error("IndexedDB write failed"));
            transaction.onabort = () => reject(transaction.error || new Error("IndexedDB write aborted"));
          }));
        }

        function flushDatabaseWrites() {
          if (databaseWriteInFlight || databaseUnavailable) return;
          databaseWriteInFlight = true;
          const writeNext = () => {
            const record = pendingDatabaseRecord;
            pendingDatabaseRecord = null;
            if (!record) {
              databaseWriteInFlight = false;
              return;
            }
            writeDatabaseRecord(record).then(writeNext).catch(() => {
              databaseUnavailable = true;
              pendingDatabaseRecord = null;
              databaseWriteInFlight = false;
            });
          };
          writeNext();
        }

        function queueDatabaseWrite(serialized, savedAt) {
          if (databaseUnavailable) return;
          pendingDatabaseRecord = { serialized, savedAt };
          flushDatabaseWrites();
        }

        function readDatabasePayload() {
          return getDatabase().then((database) => new Promise((resolve, reject) => {
            let transaction;
            let request;
            try {
              transaction = database.transaction(DATABASE_STORE, "readonly");
              request = transaction.objectStore(DATABASE_STORE).get(DATABASE_RECORD_KEY);
            } catch (error) {
              reject(error);
              return;
            }
            request.onsuccess = () => {
              const record = request.result;
              resolve(record && typeof record.serialized === "string"
                ? normalizeSavedPayload(record.serialized)
                : null);
            };
            request.onerror = () => reject(request.error || new Error("IndexedDB read failed"));
          }));
        }

        function hydrateFromDatabase() {
          const startingRevision = state.dataRevision;
          readDatabasePayload().then((saved) => {
            if (!saved || state.dataRevision !== startingRevision) return;
            const restored = applySavedMetadata(saved, loadSavedMetadata());
            if (!shouldApplyRestoredData(restored)) return;
            state.lists = restored.lists;
            state.keepDuration = restored.keepDuration;
            state.crossDuration = restored.crossDuration;
            state.defaultDetails = restored.defaultDetails;
            state.savedAt = restored.savedAt;
            applyMotionSettings();
            render();
          }).catch(() => {
            // IndexedDB 只是容错层；不可用时保留当前内存状态。
          });
        }

        function saveLists() {
          state.savedAt = Math.max(Date.now(), Number(state.savedAt || 0) + 1);
          state.dataRevision += 1;
          let metadataSerialized;
          try {
            metadataSerialized = JSON.stringify(createSavedMetadata(state.savedAt));
          } catch (error) {
            metadataSerialized = "";
          }
          if (metadataSerialized) {
            try {
              window.localStorage.setItem(METADATA_KEY, metadataSerialized);
            } catch (error) {
              // 轻量元数据继续写入其他容错层。
            }
            try {
              window.sessionStorage.setItem(METADATA_KEY, metadataSerialized);
            } catch (error) {
              // 继续写入历史记录。
            }
            try {
              const currentState = isObject(window.history.state) ? window.history.state : {};
              window.history.replaceState(
                Object.assign({}, currentState, { [HISTORY_METADATA_KEY]: metadataSerialized }),
                "",
              );
            } catch (error) {
              // 历史记录状态不是必须的。
            }
          }
          let serialized;
          try {
            serialized = JSON.stringify(createSavedPayload(state.savedAt));
          } catch (error) {
            return false;
          }
          try {
            window.localStorage.setItem(STORAGE_KEY, serialized);
          } catch (error) {
            // 继续写入其他容错层，不用存储错误打断筛词。
          }
          try {
            window.sessionStorage.setItem(STORAGE_KEY, serialized);
          } catch (error) {
            // 容量不足或 file:// 受限时继续。
          }
          if (serialized.length <= MAX_HISTORY_STATE_LENGTH) {
            try {
              const currentState = isObject(window.history.state) ? window.history.state : {};
              window.history.replaceState(
                Object.assign({}, currentState, { [HISTORY_STATE_KEY]: serialized }),
                "",
              );
            } catch (error) {
              // 历史记录状态不是必须的。
            }
          }
          if (serialized.length <= MAX_WINDOW_NAME_LENGTH) {
            try {
              window.name = WINDOW_NAME_PREFIX + serialized;
            } catch (error) {
              // 窗口状态不是必须的。
            }
          }
          queueDatabaseWrite(serialized, state.savedAt);
          return true;
        }

        function applyMotionSettings() {
          const root = document.documentElement;
          root.style.setProperty("--cross-motion-duration", state.crossDuration + "ms");
          root.style.setProperty(
            "--strike-motion-duration",
            Math.round(state.crossDuration * .44) + "ms",
          );
          root.style.setProperty("--details-motion-duration", DETAILS_TOGGLE_DURATION + "ms");
        }

        function formatMotionDuration(duration) {
          return duration === 0 ? "即时" : duration + " 毫秒";
        }

        function setMotionDuration(kind, value, persist) {
          const key = kind === "keep" ? "keepDuration" : "crossDuration";
          state[key] = normalizeDuration(value, state[key]);
          applyMotionSettings();
          const output = document.getElementById(kind + "-duration-value");
          if (output) output.textContent = formatMotionDuration(state[key]);
          if (persist) saveLists();
        }

        function getList() {
          return state.lists.find((list) => list.id === state.listId) || null;
        }

        function getEntryContent(record) {
          const outer = isObject(record.content) ? record.content : {};
          const word = isObject(outer.word) ? outer.word : {};
          return isObject(word.content) ? word.content : {};
        }

        function getHeadword(record) {
          const outer = isObject(record.content) ? record.content : {};
          const word = isObject(outer.word) ? outer.word : {};
          return text(record.headWord) ||
            text(word.wordHead) ||
            text(record.word) ||
            text(record.name) ||
            "未命名单词";
        }

        function getDetails(record) {
          const content = getEntryContent(record);
          const uk = text(content.ukphone);
          const us = text(content.usphone);
          const fallbackPhone = text(content.phone) || text(record.phonetic);
          const translations = Array.isArray(content.trans) ? content.trans : [];
          const definitions = translations
            .filter(isObject)
            .map((item) => ({
              pos: text(item.pos),
              chinese: text(item.tranCn),
              english: text(item.tranOther)
            }))
            .filter((item) => item.chinese || item.english);
          if (!definitions.length) {
            const fallback = text(record.translation) ||
              text(record.definition) ||
              text(record.meaning);
            if (fallback) definitions.push({ pos: "", chinese: fallback, english: "" });
          }
          return { uk: uk || (!us ? fallbackPhone : ""), us, definitions };
        }

        function phone(value) {
          if (!value) return "—";
          return value.charAt(0) === "/" && value.charAt(value.length - 1) === "/"
            ? value
            : "/" + value + "/";
        }

        function detailsMarkup(record) {
          const details = getDetails(record);
          const definitions = details.definitions.length
            ? details.definitions.map((item) =>
                '<div class="definition"><span>' + escapeHTML(item.pos || "释义") + '</span><div>' +
                (item.chinese ? '<p>' + escapeHTML(item.chinese) + '</p>' : "") +
                (item.english ? '<p class="english">' + escapeHTML(item.english) + '</p>' : "") +
                '</div></div>'
              ).join("")
            : '<p class="definition">该词条未提供释义</p>';
          return '<div class="phonetics">' +
            '<p><span>英</span>' + escapeHTML(phone(details.uk)) + '</p>' +
            '<p><span>美</span>' + escapeHTML(phone(details.us)) + '</p>' +
            '</div><div class="definitions">' + definitions + '</div>';
        }

        function parseWordList(raw) {
          const source = raw.replace(/^\uFEFF/, "").trim();
          if (!source) throw new Error("这个文件是空的");
          try {
            const parsed = JSON.parse(source);
            if (Array.isArray(parsed)) {
              const records = parsed.filter(isObject);
              if (records.length !== parsed.length) {
                throw new Error("词表数组中包含非对象条目");
              }
              return { records, shape: { kind: "array" } };
            }
            if (!isObject(parsed)) {
              throw new Error("JSON 顶层需要是词条对象或词条数组");
            }
            for (const key of ["words", "items", "entries", "data"]) {
              if (!Array.isArray(parsed[key])) continue;
              const records = parsed[key].filter(isObject);
              if (records.length !== parsed[key].length) {
                throw new Error("词表数组中包含非对象条目");
              }
              return { records, shape: { kind: "wrapper", key, value: clone(parsed) } };
            }
            return { records: [parsed], shape: { kind: "single" } };
          } catch (wholeFileError) {
            const lines = source.split(/\r?\n/).filter((line) => line.trim());
            if (lines.length <= 1) {
              throw wholeFileError instanceof Error
                ? wholeFileError
                : new Error("无法读取这个 JSON 文件");
            }
            const records = lines.map((line, index) => {
              try {
                const record = JSON.parse(line);
                if (!isObject(record)) throw new Error("不是词条对象");
                return record;
              } catch (error) {
                throw new Error("第 " + (index + 1) + " 行不是有效的 JSON 词条");
              }
            });
            return { records, shape: { kind: "ndjson" } };
          }
        }

        function serializeWordList(records, shape) {
          if (shape.kind === "ndjson") {
            return records.map((record) => JSON.stringify(record)).join("\n") + "\n";
          }
          if (shape.kind === "single") return JSON.stringify(records[0] || {}, null, 2);
          if (shape.kind === "wrapper") {
            return JSON.stringify(Object.assign({}, shape.value, { [shape.key]: records }), null, 2);
          }
          return JSON.stringify(records, null, 2);
        }

        function stem(name) {
          return name.replace(/\.json$/i, "");
        }

        function displayName(name) {
          return stem(text(name) || "未命名词表.json");
        }

        function beginRename(id) {
          const list = state.lists.find((item) => item.id === id);
          if (!list) return;
          state.renamingId = id;
          state.renameDraft = displayName(list.name);
          render();
        }

        function cancelRename() {
          if (!state.renamingId) return;
          state.renamingId = "";
          state.renameDraft = null;
          render();
        }

        function commitRename(id, value) {
          if (state.renamingId !== id) return;
          const list = state.lists.find((item) => item.id === id);
          if (!list) {
            state.renamingId = "";
            state.renameDraft = null;
            render();
            return;
          }
          state.renameDraft = String(value == null ? "" : value);
          const clean = text(value).replace(/\.json$/i, "").trim();
          if (!clean) {
            showNotice("词表名称不能为空", true);
            return;
          }
          const nextName = clean + ".json";
          const duplicate = state.lists.some(
            (item) => item.id !== id && item.name.toLowerCase() === nextName.toLowerCase(),
          );
          if (duplicate) {
            showNotice("已经有同名词表", true);
            return;
          }
          list.name = nextName;
          list.updatedAt = new Date().toISOString();
          state.renamingId = "";
          state.renameDraft = null;
          saveLists();
          render();
          showNotice("已重命名为：" + clean);
        }

        function confirmRename() {
          if (!state.renamingId) return;
          const input = document.getElementById("rename-dialog-input");
          commitRename(state.renamingId, input ? input.value : state.renameDraft);
        }

        function renderRenameDialog() {
          if (!state.renamingId) return "";
          const list = state.lists.find((item) => item.id === state.renamingId);
          if (!list) return "";
          const value = state.renameDraft == null
            ? displayName(list.name)
            : state.renameDraft;
          return '<div class="rename-backdrop"><section class="rename-dialog" role="dialog" aria-modal="true" aria-labelledby="rename-dialog-title">' +
            '<h2 id="rename-dialog-title">重命名</h2>' +
            '<input id="rename-dialog-input" type="text" value="' + escapeHTML(value) + '" maxlength="160" autocomplete="off" aria-label="新词表名称">' +
            '<div class="rename-dialog-actions"><button data-action="cancel-rename">取消</button><button class="rename-confirm" data-action="confirm-rename">确定</button></div>' +
            '</section></div>';
        }

        function deleteList(id) {
          const index = state.lists.findIndex((item) => item.id === id);
          if (index < 0) return;
          const list = state.lists[index];
          if (!window.confirm("确定删除“" + displayName(list.name) + "”吗？")) return;
          state.lists.splice(index, 1);
          saveLists();
          render();
          showNotice("已删除：" + displayName(list.name));
        }

        function uniqueName(name) {
          const names = new Set(state.lists.map((list) => list.name));
          if (!names.has(name)) return name;
          const base = stem(name);
          let number = 2;
          while (names.has(base + " (" + number + ").json")) number += 1;
          return base + " (" + number + ").json";
        }

        function downloadList(list, filename) {
          const output = serializeWordList(list.records, list.shape);
          const blob = new Blob([output], { type: "application/json;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = filename || list.name;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 0);
        }

        function cleanNoticeMessage(message) {
          return String(message == null ? "" : message)
            .replace(/[。．.]+$/g, "")
            .trim();
        }

        function showNotice(message, isError) {
          const cleanMessage = cleanNoticeMessage(message);
          window.clearTimeout(state.noticeTimer);
          window.clearTimeout(state.noticeCloseTimer);
          state.notice = isError ? "" : cleanMessage;
          state.error = isError ? cleanMessage : "";
          state.noticeClosing = false;
          state.noticeTimer = window.setTimeout(() => {
            dismissNotice();
          }, 2700);
          render();
        }

        function dismissNotice() {
          window.clearTimeout(state.noticeTimer);
          if (!state.notice && !state.error) return;
          if (state.noticeClosing) return;
          state.noticeClosing = true;
          render();
          state.noticeCloseTimer = window.setTimeout(() => {
            state.notice = "";
            state.error = "";
            state.noticeClosing = false;
            state.noticeCloseTimer = 0;
            render();
          }, 220);
        }

        function renderToast() {
          const leaving = state.noticeClosing ? " is-leaving" : "";
          if (state.error) {
            return '<div class="notice error' + leaving + '" data-action="dismiss" role="alert" aria-live="assertive">' +
              escapeHTML(state.error) + '</div>';
          }
          if (state.notice) {
            return '<div class="notice' + leaving + '" data-action="dismiss" role="status" aria-live="polite">' +
              escapeHTML(state.notice) + '</div>';
          }
          return "";
        }

        function clampIndex(list, value) {
          const numeric = Number.isFinite(value) ? Math.round(value) : 0;
          return Math.max(0, Math.min(numeric, Math.max(list.records.length - 1, 0)));
        }

        function rememberPosition(list, value, persist) {
          if (!list) return;
          list.cursor = clampIndex(list, value);
          if (persist) saveLists();
        }

        function enterOpen(id) {
          const list = state.lists.find((item) => item.id === id);
          if (!list || !list.records.length) {
            state.openingId = "";
            showNotice("这个词表没有词条", true);
            return;
          }
          state.openingId = "";
          state.listId = id;
          state.screen = "workspace";
          state.index = clampIndex(list, list.cursor);
          state.details = state.defaultDetails;
          state.detailsHiding = false;
          state.detailsReturnStartY = -24;
          state.detailsReturnEndY = 0;
          state.detailsToken += 1;
          state.marking = "";
          closeMore(false);
          state.moreHoverSuppressed = false;
          state.markToken += 1;
          render();
        }

        function openList(id, row) {
          if (state.openingId) return;
          const list = state.lists.find((item) => item.id === id);
          if (!list) return;
          if (!list.records.length) {
            showNotice("这个词表没有词条", true);
            return;
          }
          state.openingId = id;
          if (row) row.classList.add("is-opening");
          window.setTimeout(() => {
            if (state.openingId === id && state.screen === "list") enterOpen(id);
          }, 250);
        }

        function renderList() {
          const rows = state.lists
            .slice()
            .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)))
            .map((list) => {
              const kept = list.statuses.filter((status) => status === "keep").length;
              const crossed = list.statuses.filter((status) => status === "crossed").length;
              const title = '<h2 class="list-name">' + escapeHTML(displayName(list.name)) + '</h2>';
              return '<article class="list-row" data-list-id="' + escapeHTML(list.id) + '" tabindex="0" role="button" aria-label="打开' +
                escapeHTML(displayName(list.name)) + '">' +
                '<div class="list-title">' + title +
                '<p class="list-meta">' + list.records.length.toLocaleString("zh-CN") + ' 词' +
                (kept || crossed ? ' · 保留 ' + kept + ' · 去除 ' + crossed : "") +
                '</p></div>' +
                '<div class="list-actions">' +
                '<button data-action="copy">创建副本</button>' +
                '<button data-action="rename">重命名</button>' +
                '<button data-action="export">导出</button>' +
                '<button class="delete-action" data-action="delete">删除</button>' +
                '</div></article>';
            }).join("");
          return '<div class="shell"><header class="topbar"><button class="brand" data-action="home">词表速筛</button>' +
            '<button class="topbar-action" data-action="import">导入</button></header>' +
            '<main class="page">' +
            (rows ? '<section class="list">' + rows + '</section>' :
              '<section class="empty"><p>暂无词表</p></section>') +
            '</main>' + renderRenameDialog() + renderToast() + '</div>';
        }

        function currentWordClass(list) {
          const status = list && list.statuses[state.index] ? list.statuses[state.index] : "";
          const classes = ["word"];
          if (status === "keep") classes.push("is-kept");
          if (status === "crossed") classes.push("is-crossed");
          if (state.marking === "crossed" && status === "crossed") classes.push("is-animating");
          return classes.join(" ");
        }

        function renderWorkspace() {
          const list = getList();
          if (!list || !list.records.length) {
            state.screen = "list";
            return renderList();
          }
          const count = list.records.length;
          state.index = clampIndex(list, state.index);
          const current = list.records[state.index];
          const position = state.index;
          const progressName = escapeHTML(displayName(list.name));
          const progress = '<div class="progress-line range-wrap"><span class="progress-name">' +
            progressName + '</span><input id="open-range" type="range" min="0" max="' +
            Math.max(count - 1, 0) + '" value="' + position + '"' +
            (count <= 1 || state.marking || state.detailsHiding ? " disabled" : "") +
            '><span id="range-count">' + (state.index + 1) + ' / ' + count + '</span></div>';
          const morePanel = state.moreOpen
            ? '<div class="more-panel"><div class="more-actions">' +
              '<button data-action="toggle-default-details">' +
              (state.defaultDetails ? "默认隐藏音义" : "默认显示音义") + '</button>' +
              '<button data-action="sort-alpha">词序按字母重整</button>' +
              '<button data-action="shuffle-order">词序打乱</button>' +
              '<button data-action="clear-all">清空全部标记</button>' +
              '<button data-action="mark-unmarked-keep">保留全部未标记</button>' +
              '<button data-action="mark-unmarked-cross">去除全部未标记</button>' +
              '<button data-action="mark-all-keep">保留全部</button>' +
              '<button data-action="mark-all-cross">去除全部</button>' +
              '</div>' +
              '<label class="motion-control" for="keep-duration"><span class="motion-control-head"><span>「保留」动效时长</span><output id="keep-duration-value" class="motion-value">' +
              formatMotionDuration(state.keepDuration) + '</output></span><input id="keep-duration" data-motion="keep" type="range" min="0" max="1000" step="5" value="' +
              state.keepDuration + '"></label>' +
              '<label class="motion-control" for="cross-duration"><span class="motion-control-head"><span>「去除」动效时长</span><output id="cross-duration-value" class="motion-value">' +
              formatMotionDuration(state.crossDuration) + '</output></span><input id="cross-duration" data-motion="cross" type="range" min="0" max="1000" step="5" value="' +
              state.crossDuration + '"></label></div>'
            : "";
          const more = '<div class="more-menu"><button class="more-button" data-action="toggle-more" aria-expanded="' +
            (state.moreOpen ? "true" : "false") + '">更多</button>' + morePanel + '</div>';
          const wordClass = currentWordClass(list) + " is-clickable";
          const wordAttrs = ' tabindex="0" role="button" aria-label="复制单词"';
          const wordAreaClass = [
            "word-area",
            state.details ? "has-details" : "",
            state.details && state.detailsHiding ? "is-hiding" : "",
            state.details && state.marking ? "is-marking" : "",
            state.details && state.marking === "crossed" ? "is-cross-marking" : ""
          ].filter(Boolean).join(" ");
          const wordAreaStyle = state.detailsHiding
            ? ' style="--word-return-start:' + state.detailsReturnStartY +
              'px;--word-return-end:' + state.detailsReturnEndY + 'px"'
            : "";
          const wordContent = '<section class="' + wordAreaClass + '"' + wordAreaStyle +
            '><div class="word-wrap"><h1 id="current-word" class="' + wordClass + '"' +
            wordAttrs + '>' + escapeHTML(getHeadword(current)) + '</h1></div>' +
            '<div id="definition-panel" class="details-panel"' +
            (state.details ? "" : " hidden") + '>' +
            (state.details ? detailsMarkup(current) : "") + '</div></section>';
          const previousDisabled = state.index <= 0 || state.marking || state.detailsHiding;
          const nextDisabled = state.index >= count - 1 || state.marking || state.detailsHiding;
          const actionDisabled = state.marking || state.detailsHiding;
          const fixed = '<div class="fixed-actions"><button data-action="next"' +
            (nextDisabled ? " disabled" : "") + '>下个</button><button data-action="previous"' +
            (previousDisabled ? " disabled" : "") + '>上个</button><button data-action="details"' +
            (actionDisabled ? " disabled" : "") + '>音义</button><button data-action="cross"' +
            (actionDisabled ? " disabled" : "") + '>去除</button><button data-action="keep"' +
            (actionDisabled ? " disabled" : "") + '>保留</button></div>';
          return '<div class="shell"><main class="page workspace-page"><div class="workspace-top">' +
            '<button class="back-button" data-action="back">退出</button>' + more +
            '<button class="produce-button" data-action="produce">产出新词表</button></div>' +
            '<section class="progress-area">' + progress + '</section>' + wordContent +
            '</main>' + fixed + renderToast() + '</div>';
        }

        function render() {
          app.innerHTML = state.screen === "list" ? renderList() : renderWorkspace();
          wire();
        }

        function closeMore(suppressHover) {
          state.moreOpen = false;
          state.moreOpenByClick = false;
          window.clearTimeout(state.moreSuppressTimer);
          state.moreSuppressTimer = 0;
          state.moreHoverSuppressed = Boolean(suppressHover);
          if (suppressHover) {
            state.moreSuppressTimer = window.setTimeout(() => {
              state.moreHoverSuppressed = false;
              state.moreSuppressTimer = 0;
            }, 120);
          }
        }

        function toggleMore() {
          if (state.moreOpen && state.moreOpenByClick) {
            closeMore(true);
          } else {
            window.clearTimeout(state.moreSuppressTimer);
            state.moreSuppressTimer = 0;
            state.moreOpen = true;
            state.moreOpenByClick = true;
            state.moreHoverSuppressed = false;
          }
          render();
        }

        function handleDocumentClick(event) {
          if (!state.moreOpen) return;
          const target = event && event.target;
          if (target && typeof target.closest === "function" && target.closest(".more-menu")) return;
          closeMore(false);
          render();
        }

        function getTranslateY(element) {
          if (!element || typeof window.getComputedStyle !== "function") return -24;
          const transform = window.getComputedStyle(element).transform;
          if (!transform || transform === "none") return 0;
          try {
            if (typeof window.DOMMatrixReadOnly === "function") {
              return new window.DOMMatrixReadOnly(transform).m42;
            }
          } catch (error) {
            // 继续使用字符串解析。
          }
          const match = transform.match(/^matrix(3d)?\((.+)\)$/);
          if (!match) return -24;
          const values = match[2].split(",").map(Number);
          const value = match[1] ? values[13] : values[5];
          return Number.isFinite(value) ? value : -24;
        }

        function measureDetailsReturn() {
          const word = document.getElementById("current-word");
          const area = word && word.closest(".word-area");
          const wrap = word && word.parentElement;
          if (!word || !area || !wrap || typeof area.getBoundingClientRect !== "function") {
            return { start: -24, end: 0 };
          }
          const wordRect = word.getBoundingClientRect();
          const areaRect = area.getBoundingClientRect();
          const style = window.getComputedStyle(area);
          const paddingTop = parseFloat(style.paddingTop) || 0;
          const paddingBottom = parseFloat(style.paddingBottom) || 0;
          const minimumHeight = parseFloat(style.minHeight) || areaRect.height;
          const finalHeight = Math.max(
            minimumHeight,
            paddingTop + wordRect.height + paddingBottom,
          );
          const finalCenter = areaRect.top + paddingTop +
            (finalHeight - paddingTop - paddingBottom) / 2;
          const currentCenter = wordRect.top + wordRect.height / 2;
          const start = getTranslateY(wrap);
          return {
            start,
            end: start + finalCenter - currentCenter
          };
        }

        function disableWorkspaceControls() {
          const range = document.getElementById("open-range");
          if (range) range.disabled = true;
          app.querySelectorAll(".fixed-actions button").forEach((button) => {
            button.disabled = true;
          });
        }

        function toggleDetails() {
          const list = getList();
          if (!list || state.screen !== "workspace" || state.marking ||
              state.index >= list.records.length || state.detailsHiding) return;
          if (!state.details) {
            state.details = true;
            state.detailsReturnStartY = -24;
            state.detailsReturnEndY = 0;
            state.detailsToken += 1;
            render();
            return;
          }
          const motion = measureDetailsReturn();
          state.detailsReturnStartY = motion.start;
          state.detailsReturnEndY = motion.end;
          state.detailsHiding = true;
          const token = ++state.detailsToken;
          const currentWord = document.getElementById("current-word");
          const area = currentWord && currentWord.closest(".word-area");
          if (!area) return;
          area.style.setProperty("--word-return-start", state.detailsReturnStartY + "px");
          area.style.setProperty("--word-return-end", state.detailsReturnEndY + "px");
          void area.offsetWidth;
          area.classList.add("is-hiding");
          disableWorkspaceControls();
          window.setTimeout(() => {
            if (state.screen !== "workspace" || !state.detailsHiding ||
                state.detailsToken !== token) return;
            state.details = false;
            state.detailsHiding = false;
            state.detailsReturnStartY = -24;
            state.detailsReturnEndY = 0;
            render();
          }, DETAILS_TOGGLE_DURATION);
        }

        function legacyCopy(value) {
          const textarea = document.createElement("textarea");
          textarea.value = value;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          textarea.style.pointerEvents = "none";
          document.body.appendChild(textarea);
          textarea.select();
          textarea.setSelectionRange(0, textarea.value.length);
          const copied = typeof document.execCommand === "function" && document.execCommand("copy");
          textarea.remove();
          if (!copied) throw new Error("copy failed");
        }

        function writeClipboard(value) {
          const clipboard = window.navigator && window.navigator.clipboard;
          if (clipboard && typeof clipboard.writeText === "function") {
            return Promise.resolve(clipboard.writeText(value)).catch(() => {
              legacyCopy(value);
            });
          }
          return Promise.resolve().then(() => legacyCopy(value));
        }

        function copyCurrentWord() {
          const list = getList();
          if (!list || state.screen !== "workspace" || state.marking ||
              state.detailsHiding || state.index >= list.records.length) return;
          const word = getHeadword(list.records[state.index]);
          writeClipboard(word)
            .then(() => showNotice("已复制：" + word))
            .catch(() => showNotice("无法复制这个单词", true));
        }

        function toggleDefaultDetails() {
          state.defaultDetails = !state.defaultDetails;
          const list = getList();
          state.detailsToken += 1;
          state.detailsHiding = false;
          state.detailsReturnStartY = -24;
          state.detailsReturnEndY = 0;
          state.details = Boolean(state.defaultDetails && list);
          closeMore(true);
          saveLists();
          render();
        }

        function updateOpenPreview() {
          const list = getList();
          const range = document.getElementById("open-range");
          if (!list || !range) return;
          state.index = clampIndex(list, Number(range.value));
          rememberPosition(list, state.index, false);
          state.detailsHiding = false;
          state.detailsToken += 1;
          state.detailsReturnStartY = -24;
          state.detailsReturnEndY = 0;
          state.details = state.defaultDetails;
          const word = document.getElementById("current-word");
          const panel = document.getElementById("definition-panel");
          const count = document.getElementById("range-count");
          const area = word ? word.closest(".word-area") : null;
          const record = list.records[state.index];
          if (!record || !word || !area) {
            render();
            return;
          }
          word.textContent = getHeadword(record);
          word.className = currentWordClass(list) + " is-clickable";
          area.className = state.details ? "word-area has-details" : "word-area";
          if (panel) {
            panel.innerHTML = state.details ? detailsMarkup(record) : "";
            panel.hidden = !state.details;
          }
          if (count) count.textContent = (state.index + 1) + " / " + list.records.length;
          const previous = app.querySelector('[data-action="previous"]');
          const next = app.querySelector('[data-action="next"]');
          const details = app.querySelector('[data-action="details"]');
          const keep = app.querySelector('[data-action="keep"]');
          const cross = app.querySelector('[data-action="cross"]');
          if (previous) previous.disabled = state.index <= 0 || Boolean(state.marking || state.detailsHiding);
          if (next) next.disabled = state.index >= list.records.length - 1 ||
            Boolean(state.marking || state.detailsHiding);
          if (details) details.disabled = Boolean(state.marking || state.detailsHiding);
          if (keep) keep.disabled = Boolean(state.marking || state.detailsHiding);
          if (cross) cross.disabled = Boolean(state.marking || state.detailsHiding);
        }

        function previousWord() {
          const list = getList();
          if (!list || state.marking || state.detailsHiding || state.index <= 0) return;
          state.index -= 1;
          rememberPosition(list, state.index, true);
          state.detailsToken += 1;
          state.detailsHiding = false;
          state.detailsReturnStartY = -24;
          state.detailsReturnEndY = 0;
          state.details = state.defaultDetails;
          render();
        }

        function nextWord() {
          const list = getList();
          if (!list || state.marking || state.detailsHiding ||
              state.index >= list.records.length - 1) return;
          state.index += 1;
          rememberPosition(list, state.index, true);
          state.detailsToken += 1;
          state.detailsHiding = false;
          state.detailsReturnStartY = -24;
          state.detailsReturnEndY = 0;
          state.details = state.defaultDetails;
          render();
        }

        function reorderCurrentList(mode) {
          const list = getList();
          if (!list || list.records.length < 2 || state.marking || state.detailsHiding) return;
          const currentRecord = list.records[state.index];
          const entries = list.records.map((record, index) => ({
            record,
            status: list.statuses[index] || ""
          }));
          if (mode === "alpha") {
            let collator;
            try {
              collator = new Intl.Collator("en", {
                numeric: true,
                sensitivity: "base"
              });
            } catch (error) {
              collator = null;
            }
            entries.sort((left, right) => {
              const a = getHeadword(left.record);
              const b = getHeadword(right.record);
              return collator
                ? collator.compare(a, b)
                : a.toLowerCase().localeCompare(b.toLowerCase());
            });
          } else {
            for (let index = entries.length - 1; index > 0; index -= 1) {
              const randomIndex = Math.floor(Math.random() * (index + 1));
              const current = entries[index];
              entries[index] = entries[randomIndex];
              entries[randomIndex] = current;
            }
          }
          list.records = entries.map((entry) => entry.record);
          list.statuses = entries.map((entry) => entry.status);
          const nextIndex = list.records.indexOf(currentRecord);
          state.index = nextIndex >= 0 ? nextIndex : 0;
          list.cursor = clampIndex(list, state.index);
          list.updatedAt = new Date().toISOString();
          state.detailsToken += 1;
          state.detailsHiding = false;
          state.detailsReturnStartY = -24;
          state.detailsReturnEndY = 0;
          closeMore(true);
          saveLists();
          render();
          showNotice(mode === "alpha" ? "已按字母重整词序" : "已打乱词序");
        }

        function markAll(status, onlyUnmarked) {
          const list = getList();
          if (!list || !list.records.length || state.marking) return;
          if (status !== "keep" && status !== "crossed" && status !== "") return;
          let changed = 0;
          list.statuses = list.records.map((_, index) => {
            const current = list.statuses[index] || "";
            if (onlyUnmarked && current) return current;
            if (current !== status) changed += 1;
            return status;
          });
          list.cursor = clampIndex(list, state.index);
          list.updatedAt = new Date().toISOString();
          state.detailsToken += 1;
          state.detailsHiding = false;
          state.detailsReturnStartY = -24;
          state.detailsReturnEndY = 0;
          state.details = state.defaultDetails;
          closeMore(true);
          state.markToken += 1;
          saveLists();
          render();
          const message = status === ""
            ? "已清空全部标记"
            : !changed && onlyUnmarked
            ? "没有未标记的词"
            : onlyUnmarked
              ? status === "keep" ? "已保留全部未标记词" : "已去除全部未标记词"
              : status === "keep" ? "已全部标记为保留" : "已全部标记为去除";
          showNotice(message);
        }

        function leaveOpen() {
          const list = getList();
          if (list) rememberPosition(list, state.index, true);
          state.screen = "list";
          state.listId = "";
          state.index = 0;
          state.details = false;
          state.detailsHiding = false;
          state.detailsReturnStartY = -24;
          state.detailsReturnEndY = 0;
          state.detailsToken += 1;
          state.marking = "";
          closeMore(false);
          state.moreHoverSuppressed = false;
          state.openingId = "";
          state.markToken += 1;
          render();
        }

        function markCurrent(status) {
          const list = getList();
          if (!list || state.screen !== "workspace" || state.marking ||
              state.detailsHiding || state.index >= list.records.length) return;
          const markedIndex = state.index;
          list.statuses[markedIndex] = status;
          list.updatedAt = new Date().toISOString();
          list.cursor = clampIndex(list, markedIndex + 1);
          state.marking = status;
          const markToken = ++state.markToken;
          saveLists();
          render();
          window.setTimeout(() => {
            if (state.listId !== list.id || state.screen !== "workspace" ||
                state.marking !== status || state.markToken !== markToken) return;
            state.index = clampIndex(list, markedIndex + 1);
            rememberPosition(list, state.index, false);
            state.marking = "";
            state.detailsHiding = false;
            state.detailsToken += 1;
            state.detailsReturnStartY = -24;
            state.detailsReturnEndY = 0;
            state.details = state.defaultDetails;
            render();
          }, status === "crossed" ? state.crossDuration : state.keepDuration);
        }

        function produceList() {
          const list = getList();
          if (!list) return;
          const records = list.records.filter((record, index) => list.statuses[index] === "keep");
          if (!records.length) {
            showNotice("请至少保留一个词");
            return;
          }
          const output = {
            id: uid(),
            name: uniqueName(stem(list.name) + "-新.json"),
            records: clone(records),
            shape: clone(list.shape),
            statuses: records.map(() => ""),
            cursor: 0,
            updatedAt: new Date().toISOString()
          };
          state.lists.unshift(output);
          saveLists();
          state.screen = "list";
          state.listId = "";
          state.marking = "";
          closeMore(false);
          state.moreHoverSuppressed = false;
          state.openingId = "";
          state.renamingId = "";
          state.renameDraft = null;
          state.markToken += 1;
          showNotice("已产出新词表：" + displayName(output.name));
        }

        function createCopy() {
          const source = getList();
          if (!source) return;
          const copy = {
            id: uid(),
            name: uniqueName(stem(source.name) + " 副本.json"),
            records: clone(source.records),
            shape: clone(source.shape),
            statuses: source.records.map(() => ""),
            cursor: 0,
            updatedAt: new Date().toISOString()
          };
          state.lists.unshift(copy);
          saveLists();
          showNotice("已创建副本：" + displayName(copy.name));
        }

        function importFile(file) {
          if (!file) return;
          if (!/\.json$/i.test(file.name)) {
            showNotice("请选择 .json 词表文件", true);
            return;
          }
          file.text().then((raw) => {
            const imported = parseWordList(raw);
            if (!imported.records.length) throw new Error("词表中没有可用词条");
            const list = {
              id: uid(),
              name: uniqueName(file.name),
              records: imported.records,
              shape: imported.shape,
              statuses: imported.records.map(() => ""),
              cursor: 0,
              updatedAt: new Date().toISOString()
            };
            state.lists.unshift(list);
            saveLists();
            state.screen = "list";
            state.listId = "";
            closeMore(false);
            state.moreHoverSuppressed = false;
            state.openingId = "";
            state.renamingId = "";
            state.renameDraft = null;
            render();
            showNotice("已导入：" + displayName(list.name));
          }).catch((error) => {
            showNotice(error && error.message ? error.message : "无法读取这个词表", true);
          });
